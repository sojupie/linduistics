services:
  postgres:
    image: postgres:16-alpine
    container_name: linduistics-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-linduistics}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linduistics"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    name: linduistics_pgdata
